<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>두근두근 심박수를 낮춰라!</title>
<style>
  :root{
    --bg:#eef7ff; --card:#fff; --ink:#24324a; --sub:#5d6b82;
    --pink:#ff5d8f; --pink-l:#ffe3ec; --blue:#3d8bfd; --blue-l:#e2efff;
    --green:#2fb36d; --green-l:#e3f7ec; --yellow:#ffc531; --yellow-l:#fff6d9;
    --orange:#ff9437; --red:#f0504a; --line:#d9e2ef;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  button{font:inherit;cursor:pointer;border:0}
  input{font:inherit}
  .wrap{max-width:1200px;margin:0 auto;padding:16px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  header.top h1{margin:0;font-size:28px;letter-spacing:-.5px}
  header.top h1 span{color:var(--pink)}
  header.top p{margin:4px 0 0;color:var(--sub)}
  .btn{padding:12px 18px;border-radius:14px;font-weight:700;font-size:17px}
  .btn-ghost{background:#fff;color:var(--sub);border:2px solid var(--line)}
  .btn-main{background:var(--blue);color:#fff}
  .btn-pink{background:var(--pink);color:#fff}
  .btn-green{background:var(--green);color:#fff}
  .btn:disabled{opacity:.4}

  /* 5명 칸 */
  .lanes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .lane{background:var(--card);border-radius:20px;padding:16px;border:3px solid transparent;
    box-shadow:0 4px 14px rgba(40,70,120,.08);text-align:left;min-height:190px;display:flex;flex-direction:column;gap:8px}
  .lane:active{transform:scale(.98)}
  .lane .no{font-size:22px;font-weight:800}
  .lane .state{font-size:16px;color:var(--sub)}
  .lane .big{font-size:30px;font-weight:800;margin-top:auto}
  .lane.s0{border-color:var(--line)}
  .lane.s1,.lane.s2,.lane.s3{border-color:var(--blue)}
  .lane.s4{border-color:var(--orange)}
  .lane.s5{border-color:var(--green)}
  .tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:14px;font-weight:700}

  /* 진행 화면 */
  .panel{display:none}
  .panel.on{display:block}
  .stepbar{display:flex;gap:6px;margin:6px 0 16px}
  .stepbar i{flex:1;height:8px;border-radius:9px;background:var(--line)}
  .stepbar i.on{background:var(--blue)}
  .box{background:#fff;border-radius:22px;padding:24px;box-shadow:0 4px 14px rgba(40,70,120,.08)}
  .box h2{margin:0 0 6px;font-size:26px}
  .box .hint{color:var(--sub);margin:0 0 18px;font-size:17px;line-height:1.5}
  .numrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .numrow input{width:180px;font-size:44px;font-weight:800;text-align:center;padding:10px;border-radius:16px;border:3px solid var(--line)}
  .numrow input:focus{outline:none;border-color:var(--blue)}
  .numrow .unit{font-size:24px;color:var(--sub);font-weight:700}
  .warn{margin-top:14px;padding:14px 16px;border-radius:14px;background:#ffe5e3;color:#b42318;font-weight:700;font-size:18px;display:none}
  .actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .method{background:var(--blue-l);border-radius:20px;padding:22px;text-align:center;border:3px solid transparent}
  .method .em{font-size:52px}
  .method b{display:block;font-size:22px;margin:6px 0}
  .method small{color:var(--sub);font-size:15px;line-height:1.4}
  .timer{font-size:80px;font-weight:800;text-align:center;letter-spacing:2px;margin:6px 0}
  .timer.over{color:var(--red)}
  .guide{background:var(--yellow-l);border-radius:16px;padding:14px 18px;font-size:18px;line-height:1.6}

  /* 결과: 감정 조절 처방전 */
  .rx{background:linear-gradient(#dff0ff,#f4faff);border-radius:26px;padding:20px}
  .rx-head{text-align:center;margin-bottom:14px}
  .rx-head .ai{display:inline-block;background:var(--blue);color:#fff;border-radius:99px;padding:4px 14px;font-weight:700;font-size:16px}
  .rx-head h2{margin:8px 0 4px;font-size:34px;letter-spacing:-1px}
  .rx-head h2 em{font-style:normal;color:var(--pink)}
  .rx-head p{margin:0;color:var(--sub);font-size:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:820px){.grid2{grid-template-columns:1fr}}
  .card{background:#fff;border-radius:20px;padding:16px 18px;border:3px solid}
  .card h3{margin:0 0 10px;font-size:20px;display:flex;align-items:center;gap:8px}
  .c-pink{border-color:#ffb3c9}.c-pink h3{color:#d6336c}
  .c-blue{border-color:#9cc8ff}.c-blue h3{color:#1f6fd6}
  .c-green{border-color:#9be2b9}.c-green h3{color:#198754}
  .c-yellow{border-color:#ffd970}.c-yellow h3{color:#b7791f}
  .signals{display:flex;align-items:stretch;gap:6px}
  .sig{flex:1;text-align:center;border-radius:14px;padding:10px 4px}
  .sig .ico{font-size:30px}
  .sig .lb{font-weight:700;font-size:15px}
  .sig .v{margin:6px auto;border-radius:99px;padding:6px 0;font-size:22px;font-weight:800;width:92%}
  .sig .q{font-size:12.5px;color:var(--sub);line-height:1.35}
  .arrow{align-self:center;color:#ff7aa2;font-size:22px}
  .rtime{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;
    background:var(--pink-l);border-radius:14px;padding:8px 14px;font-size:15px}
  .rtime b{font-size:22px}
  .score{display:flex;gap:14px;align-items:center}
  .gauge{width:170px;flex:none;text-align:center}
  .gauge .pt{font-size:30px;font-weight:800;margin-top:-6px}
  .gauge .band{font-size:13px;color:var(--sub)}
  .bubble{flex:1;background:var(--yellow-l);border-radius:16px;padding:12px 14px;font-size:15.5px;line-height:1.55}
  .bubble b{display:block;font-size:17px;color:#b7791f;margin-bottom:4px}
  ul.check{list-style:none;margin:10px 0 0;padding:0}
  ul.check li{padding:4px 0 4px 28px;position:relative;font-size:15.5px;line-height:1.45}
  ul.check li:before{content:"✔";position:absolute;left:0;top:3px;width:20px;height:20px;border-radius:6px;
    background:var(--green);color:#fff;font-size:13px;text-align:center;line-height:20px}
  .rxcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:560px){.rxcols{grid-template-columns:1fr}}
  .rxcols>div{background:var(--green-l);border-radius:14px;padding:10px 12px}
  .rxcols h4{margin:0 0 4px;font-size:16px}
  .growth{display:flex;gap:12px;align-items:center}
  .growth .face{font-size:64px}
  .growth p{margin:0;font-size:17px;line-height:1.6}
  .growth .cheer{margin-top:8px;font-weight:800;color:var(--orange);font-size:19px}
  .note{color:var(--sub);font-size:13px;margin-top:12px;text-align:center}
  .modal{position:fixed;inset:0;background:rgba(20,30,50,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
  .modal.on{display:flex}
  .modal .box{max-width:460px;width:100%}
  .pic{position:relative;container-type:inline-size;max-width:620px;margin:0 auto;border-radius:22px;overflow:hidden;background:#fff}
  .pic img{display:block;width:100%;height:auto}
  .ov{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:800;border-radius:6px;line-height:1.25;text-align:center}
  .ov.box{flex-direction:column;justify-content:center;gap:2px;background:#fff8ee;border:2px solid #ffd8b0;border-radius:10px;padding:2px 4px;color:#33415c;font-weight:600}
  .ov.box b{color:#e8590c}
  .ov.list{flex-direction:column;align-items:flex-start;justify-content:space-around;background:#fff;color:#33415c;font-weight:600;text-align:left}
  .res{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
  .res .pic{margin:0;flex:0 1 620px}
  .qrbox{background:#fff;border-radius:18px;padding:14px;text-align:center;width:200px;box-shadow:0 4px 14px rgba(40,70,120,.08)}
  .qrbox .qr svg{width:170px;height:170px}
  .qrbox b{display:block;margin:6px 0 4px;font-size:16px}
  .qrbox span{font-size:13px;color:var(--sub);line-height:1.4}
  .phone{padding:10px}
  .lanes{grid-template-columns:repeat(5,1fr)}
  @media (max-width:1000px){.lanes{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
  .gl{gap:6px;padding:12px;min-height:420px}
  .gl:active{transform:none}
  .glb{font-size:13px;color:var(--sub);font-weight:700;margin-top:4px}
  .gin{display:flex;align-items:center;gap:6px}
  .gin input{width:100%;min-width:0;font-size:28px;font-weight:800;text-align:center;padding:6px;border-radius:12px;border:2px solid var(--line)}
  .gin input:focus{outline:none;border-color:var(--blue)}
  .gin span{color:var(--sub);font-weight:700}
  .gm{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .gm button{background:var(--blue-l);border-radius:10px;padding:6px 2px;font-size:13px;font-weight:700;border:2px solid transparent;line-height:1.3}
  .gm button.on{border-color:var(--blue);background:#cfe3ff}
  .gstate{font-size:14px;color:var(--sub);font-weight:700;margin-top:auto}
  .gwarn{display:none;font-size:13px;color:#b42318;background:#ffe5e3;border-radius:8px;padding:6px;font-weight:700}
  .gtimer{font-size:52px;font-weight:800;text-align:center;margin:auto 0}
  .gtimer.over{color:var(--red)}
  .gbig{width:100%;padding:16px 6px;font-size:18px}
  .grow{display:flex;gap:6px}
  .gscore{font-size:34px;font-weight:800;text-align:center;margin-top:auto}
  .gbar{display:flex;justify-content:center;margin:0 0 14px}
  .gbar .btn{font-size:22px;padding:16px 36px}
</style>
</head>
<body>
<div class="wrap">

  <!-- 첫 화면: 5명 칸 -->
  <section id="home" class="panel on">
    <header class="top">
      <div>
        <h1>💓 두근두근 <span>심박수를 낮춰라!</span></h1>
        <p>5명의 숫자와 회복법을 입력한 뒤, 가운데 버튼으로 동시에 회복 타이머를 시작하세요</p>
      </div>
      <button class="btn btn-ghost" onclick="askResetAll()">🗑 모두 지우기</button>
    </header>
    <div class="gbar"><button class="btn btn-main" id="gstart" onclick="gStart()">▶ 동시에 회복 시작</button></div>
    <div class="lanes" id="lanes"></div>
    <p class="note">이름 없이 번호로만 기록해요. 이 화면의 기록은 태블릿에 저장되지 않으며, 새로고침하거나 '지우기'를 누르면 사라져요.</p>
  </section>

  <!-- 진행 화면 -->
  <section id="flow" class="panel">
    <header class="top">
      <div><h1 id="flowTitle">1번 체험자</h1></div>
      <button class="btn btn-ghost" onclick="goHome()">← 전체 화면</button>
    </header>
    <div class="stepbar" id="stepbar"></div>
    <div id="stepArea"></div>
  </section>

</div>

<div class="modal" id="modal">
  <div class="box">
    <h2 id="mTitle">확인</h2>
    <p class="hint" id="mText"></p>
    <div class="actions">
      <button class="btn btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn btn-pink" id="mOk">확인</button>
    </div>
  </div>
</div>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;

<script>
/* ===== 설정값 (필요하면 숫자만 바꾸세요) ===== */
const LANES = 5;            // 동시에 체험하는 인원
const RANGE = 5;            // 회복 기준: 안정 시 심박수 ±5bpm
const LIMIT = 180;          // 이 심박수 이상이면 즉시 중단 안내
const RECOVER_SEC = 300;    // 미션2(회복) 제한 시간 5분

const METHODS = {
  breath:{em:"🌬️",name:"호흡법",desc:"4초 들이마시고, 4초 멈추고, 6초 내쉬기",
    guide:"코로 4초 천천히 들이마시고 → 4초 멈추고 → 입으로 6초 동안 길게 내쉬어요. 배가 풍선처럼 부풀었다 줄어드는 것을 느껴 보세요."},
  stretch:{em:"🧘",name:"스트레칭",desc:"천천히 몸을 늘이며 긴장 풀기",
    guide:"두 팔을 머리 위로 쭉 뻗고 10초, 어깨를 천천히 5번 돌리고, 목을 좌우로 기울여요. 숨은 멈추지 말고 편하게 쉬어요."},
  mind:{em:"🌿",name:"마음챙김",desc:"눈을 감고 지금 내 몸에 집중하기",
    guide:"편하게 앉아 눈을 감아요. 들리는 소리 3가지, 느껴지는 몸의 감각 3가지를 마음속으로 하나씩 세어 보세요."}
};

/* ===== 상태 (메모리에만 보관, 저장 안 함) ===== */
const blank = () => ({step:0, rest:null, peak:null, method:null, start:null, end:null, after:null, timedOut:false});
let lanes = Array.from({length:LANES}, blank);
let cur = 0;
let tick = null;

const $ = s => document.querySelector(s);
const fmt = sec => { sec=Math.max(0,Math.round(sec)); return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`; };
const elapsed = L => ((L.end ?? Date.now()) - L.start)/1000;

/* ===== 첫 화면 ===== */
const STATE_TXT = ["대기 중","① 안정 시 심박수","② 버피테스트","③ 회복법 고르기","④ 회복 중","⑤ 처방전 완성"];
function renderHome(){
  $("#lanes").innerHTML = lanes.map((L,i)=>{
    let big = "시작하기 ▶";
    if(L.step===4) big = "⏱ " + fmt(elapsed(L));
    else if(L.step===5) big = "📋 처방전 보기";
    else if(L.step>0) big = "이어서 ▶";
    return `<button class="lane s${L.step}" onclick="openLane(${i})">
      <div class="no">${i+1}번 체험자</div>
      <div class="state">${STATE_TXT[L.step]}</div>
      ${L.rest?`<div class="tag" style="background:var(--blue-l)">안정 ${L.rest} bpm</div>`:""}
      ${L.method?`<div class="tag" style="background:var(--green-l)">${METHODS[L.method].em} ${METHODS[L.method].name}</div>`:""}
      <div class="big">${big}</div></button>`;
  }).join("");
}
function goHome(){ $("#flow").classList.remove("on"); $("#home").classList.add("on"); renderHome(); }
function openLane(i){
  cur=i; if(lanes[i].step===0) lanes[i].step=1;
  $("#home").classList.remove("on"); $("#flow").classList.add("on"); renderStep();
}

/* ===== 단계 화면 ===== */
function renderStep(){
  const L = lanes[cur];
  $("#flowTitle").textContent = `${cur+1}번 체험자`;
  $("#stepbar").innerHTML = [1,2,3,4,5].map(n=>`<i class="${n<=L.step?'on':''}"></i>`).join("");
  const A = $("#stepArea");

  if(L.step===1){
    A.innerHTML = `<div class="box">
      <h2>① 안정 시 심박수</h2>
      <p class="hint">편하게 앉아 1분 정도 쉰 뒤, 스마트밴드에 나온 숫자를 입력하세요. 이 숫자가 '기준값'이 돼요.</p>
      ${numInput("v", L.rest)}
      <div class="warn" id="w"></div>
      <div class="actions"><button class="btn btn-main" onclick="saveRest()">다음 ▶</button></div></div>`;
  }
  if(L.step===2){
    A.innerHTML = `<div class="box">
      <h2>② 미션1 · 심박수 UP! 🔥</h2>
      <p class="hint">버피테스트로 심박수를 올려요(8~10회, 체력에 맞게). <b style="color:var(--red)">${LIMIT}bpm이 넘으면 바로 멈춰요!</b><br>운동이 끝난 순간 밴드에 나온 가장 높은 심박수를 입력하세요.</p>
      ${numInput("v", L.peak)}
      <div class="warn" id="w"></div>
      <div class="actions">
        <button class="btn btn-ghost" onclick="back()">◀ 이전</button>
        <button class="btn btn-main" onclick="savePeak()">다음 ▶</button></div></div>`;
    $("#v").addEventListener("input", e=>{
      const v=+e.target.value, w=$("#w");
      if(v>=LIMIT){ w.style.display="block"; w.textContent=`⚠️ ${LIMIT}bpm 이상이에요! 운동을 바로 멈추고 회복 활동으로 넘어가세요.`; }
      else w.style.display="none";
    });
  }
  if(L.step===3){
    A.innerHTML = `<div class="box">
      <h2>③ 미션2 · 나만의 회복법 고르기 🌈</h2>
      <p class="hint">체험자가 직접 하나를 눌러요. 누르는 순간 회복 타이머가 시작돼요.</p>
      <div class="methods">${Object.entries(METHODS).map(([k,m])=>`
        <button class="method" onclick="pickMethod('${k}')"><div class="em">${m.em}</div><b>${m.name}</b><small>${m.desc}</small></button>`).join("")}
      </div>
      <div class="actions"><button class="btn btn-ghost" onclick="back()">◀ 이전</button></div></div>`;
  }
  if(L.step===4){
    const m = METHODS[L.method];
    A.innerHTML = `<div class="box">
      <h2>④ ${m.em} ${m.name}으로 심박수 DOWN 💧</h2>
      <p class="hint">기준값 <b>${L.rest}bpm</b> · 목표: <b>${L.rest-RANGE}~${L.rest+RANGE}bpm</b> 안으로 돌아오기 (제한 ${RECOVER_SEC/60}분)</p>
      <div class="timer" id="t">0:00</div>
      <div class="guide">${m.guide}</div>
      <div class="actions">
        <button class="btn btn-ghost" onclick="cancelTimer()">◀ 회복법 다시 고르기</button>
        <button class="btn btn-green" style="flex:1;font-size:22px;padding:18px" onclick="askAfter(false)">✅ 회복 완료 (목표 안에 들어왔어요)</button>
      </div></div>`;
    updateTimer();
  }
  if(L.step===5){ A.innerHTML = resultHTML(L); }
}
function numInput(id,val){
  return `<div class="numrow"><input id="${id}" type="number" inputmode="numeric" min="40" max="230" value="${val??''}" placeholder="0"><span class="unit">bpm</span></div>`;
}
function readNum(){
  const v = Math.round(+$("#v").value), w=$("#w");
  if(!v || v<40 || v>230){ w.style.display="block"; w.textContent="40~230 사이 숫자를 입력해 주세요."; return null; }
  return v;
}
function back(){ lanes[cur].step--; renderStep(); }
function saveRest(){ const v=readNum(); if(v==null) return; lanes[cur].rest=v; lanes[cur].step=2; renderStep(); }
function savePeak(){
  const v=readNum(); if(v==null) return;
  const L=lanes[cur];
  if(v<=L.rest+RANGE){ const w=$("#w"); w.style.display="block"; w.textContent=`안정 시 심박수(${L.rest})보다 충분히 높아야 해요. 숫자를 다시 확인해 주세요.`; return; }
  L.peak=v; L.step=3; renderStep();
}
function pickMethod(k){ const L=lanes[cur]; L.method=k; L.start=Date.now(); L.end=null; L.step=4; renderStep(); }
function cancelTimer(){ const L=lanes[cur]; L.start=null; L.method=null; L.step=3; renderStep(); }

/* 회복 완료 / 시간 종료: 회복 후 심박수 입력 */
function askAfter(timedOut){
  const L=lanes[cur];
  if(!L.end) L.end = Date.now();
  L.timedOut = timedOut || elapsed(L) > RECOVER_SEC;
  if(L.timedOut) L.end = L.start + RECOVER_SEC*1000;
  showModal(L.timedOut ? "⏰ 5분이 지났어요" : "✅ 회복 완료!",
    `${fmt(elapsed(L))} 걸렸어요. 지금 스마트밴드에 나온 심박수를 입력해 주세요.<br><br>${numInput("v2","")}<div class="warn" id="w2"></div>`,
    ()=>{
      const v=Math.round(+$("#v2").value);
      if(!v||v<40||v>230){ $("#w2").style.display="block"; $("#w2").textContent="40~230 사이 숫자를 입력해 주세요."; return false; }
      L.after=v;
      L.step=5; renderStep(); return true;
    }, ()=>{ if(!L.timedOut){ L.end=null; } });
  setTimeout(()=>$("#v2")&&$("#v2").focus(),50);
}

function updateTimer(){
  lanes.forEach((L,i)=>{
    if(L.step===4 && !L.end && elapsed(L)>=RECOVER_SEC){
      L.end = L.start + RECOVER_SEC*1000;
      if(i===cur && $("#flow").classList.contains("on")) askAfter(true);
    }
  });
  const L=lanes[cur], t=$("#t");
  if(t && L.step===4){ t.textContent = fmt(elapsed(L)); t.classList.toggle("over", elapsed(L)>RECOVER_SEC-30); }
  if($("#home").classList.contains("on")) renderHome();
}
tick = setInterval(updateTimer, 500);

/* ===== 규칙 기반 분석 ===== */
function analyze(L){
  const t = elapsed(L);
  let score;
  if(!L.timedOut){
    score = Math.round(100 - 69 * Math.min(t,RECOVER_SEC)/RECOVER_SEC);  // 31~100점
  } else {
    const ratio = Math.max(0, Math.min(1, (L.peak - L.after)/Math.max(1, L.peak - L.rest)));
    score = Math.round(30 * ratio);                                       // 0~30점
  }
  score = Math.max(0, Math.min(100, score));
  const band = score>=70 ? 2 : score>=31 ? 1 : 0;
  return {t, score, band};
}

const BAND = [
  {name:"자라나는 중", face:"🌱", title:"회복탄력 능력이 자라나는 중이에요!",
   text:"오늘은 심박수가 천천히 돌아왔어요. 괜찮아요! 몸도 마음도 연습할수록 더 빨리 안정을 찾을 수 있어요.",
   strengths:["오늘 끝까지 도전한 끈기가 있어요.","내 몸의 변화를 알아차리기 시작했어요.","나에게 맞는 회복법을 찾아가는 중이에요."]},
  {name:"차근차근 성장 중", face:"🙂", title:"회복탄력 능력이 차근차근 자라고 있어요!",
   text:"스트레스 상황에서도 점점 안정을 찾을 수 있어요. 지금처럼 꾸준히 실천하면 더 강한 마음을 만들 수 있어요!",
   strengths:["힘든 운동 뒤에도 스스로 안정을 찾았어요.","내게 맞는 회복법을 잘 골랐어요.","조금씩 더 빨리 회복하는 힘이 자라고 있어요."]},
  {name:"우수한 편", face:"😄", title:"회복탄력 능력이 우수한 편이에요!",
   text:"스트레스 상황에서도 빠르게 안정되는 힘이 좋아요. 지금처럼 꾸준히 실천하면 더 강한 마음을 만들 수 있어요!",
   strengths:["스트레스 상황에서 감정을 잘 조절해요.","마음이 흔들려도 빠르게 회복하는 힘이 있어요.","긍정적인 생각과 행동으로 다시 일어설 수 있어요."]}
];
const EMO_TIPS = {
  breath:["화가 나거나 떨릴 때 '4-4-6 호흡' 3번 하기","잠들기 전 배로 숨 쉬기 1분","내 감정 알아차리기 (감정 일기 한 줄)"],
  stretch:["긴장될 때 어깨 돌리기 5번","공부 30분마다 기지개 켜기","내 감정 알아차리기 (감정 일기 한 줄)"],
  mind:["속상할 때 들리는 소리 3가지 세어 보기","부정적인 생각을 긍정적인 말로 바꿔 보기","내 감정 알아차리기 (감정 일기 한 줄)"]
};
const HABIT_TIPS = [
  ["매일 10분 줄넘기나 걷기로 몸 깨우기","밤에 일찍 자서 충분히 쉬기","오늘 고른 회복법을 하루 1번 연습하기"],
  ["매일 규칙적으로 수면하기","가벼운 운동 습관 만들기 (줄넘기·걷기)","오늘 고른 회복법을 꾸준히 연습하기"],
  ["지금의 운동 습관 꾸준히 이어가기","다른 회복법도 하나 더 익혀 보기","친구에게 오늘 배운 회복법 알려 주기"]

  "오늘 끝까지 해낸 나, 정말 멋져요! 연습할수록 몸과 마음은 더 튼튼해질 거예요.",

function gaugeSVG(score){
  // 반원 게이지: 빨강 → 주황 → 노랑 → 초록
  const cx=85, cy=85, r=66;
  const seg=(a0,a1,c)=>{ const p=a=>[cx+r*Math.cos(Math.PI*(1-a)), cy-r*Math.sin(Math.PI*(1-a))];
    const [x0,y0]=p(a0),[x1,y1]=p(a1); return `<path d="M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}" stroke="${c}" stroke-width="18" fill="none"/>`; };
  const a=score/100, nx=cx+(r-14)*Math.cos(Math.PI*(1-a)), ny=cy-(r-14)*Math.sin(Math.PI*(1-a));
  return `<svg viewBox="0 0 170 100" width="170" height="100">
    ${seg(0,.3,"#f0504a")}${seg(.305,.5,"#ff9437")}${seg(.505,.69,"#ffc531")}${seg(.695,1,"#2fb36d")}
    <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#24324a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="8" fill="#24324a"/></svg>`;
}

function resultHTML(L){
  const {t,score,band} = analyze(L), B=BAND[band], m=METHODS[L.method];
  const timeTxt = L.timedOut ? `5분 동안 ${L.peak-L.after}bpm 내려왔어요` : `${Math.floor(t/60)}분 ${Math.round(t%60)}초`;

    <div class="rx-head"><span class="ai">🤖 AI가 분석한</span>
      <h2>나만의 <em>감정 조절</em> 처방전</h2>
      <p>내 몸의 신호를 알아차리고, 더 건강한 내일을 만들어요</p></div>
    <div class="grid2">
      <div class="card c-pink"><h3>💗 나의 몸 신호 알아보기</h3>
        <div class="signals">
          <div class="sig" style="background:var(--blue-l)"><div class="ico">🧍</div><div class="lb">안정 시 심박수</div>
            <div class="v" style="background:#9cc8ff">${L.rest}</div><div class="q">지금 나는<br>어떤 상태일까요?</div></div>
          <div class="arrow">➜</div>
          <div class="sig" style="background:var(--pink-l)"><div class="ico">🏃</div><div class="lb">활동 후 심박수</div>
            <div class="v" style="background:#ffb3c9">${L.peak}</div><div class="q">활동할 때 내 몸은<br>어떻게 반응했나요?</div></div>
          <div class="arrow">➜</div>
          <div class="sig" style="background:var(--green-l)"><div class="ico">${m.em}</div><div class="lb">회복 후 심박수</div>
            <div class="v" style="background:#9be2b9">${L.after}</div><div class="q">다시 안정을 찾기까지<br>얼마나 걸렸나요?</div></div>
        </div>
        <div class="rtime"><span>💡 이 데이터는 내 감정 상태와 스트레스 정도를 알아보는 신호예요.</span>
          <span style="white-space:nowrap">⏱ 회복 소요시간 <b>${timeTxt}</b></span></div>
      </div>
      <div class="card c-blue"><h3>🛡️ 나의 회복탄력 능력 결과</h3>
        <div class="score">
          <div class="gauge">${gaugeSVG(score)}<div class="pt">${B.face} ${score}점</div><div class="band">( ${B.name} )</div></div>
          <div class="bubble"><b>${B.title}</b>${B.text}</div>

/* ===== 지우기 / 모달 ===== */
let mCancel=null;
function showModal(title, html, onOk, onCancel){
  $("#mTitle").textContent=title; $("#mText").innerHTML=html; mCancel=onCancel||null;
  $("#mOk").onclick=()=>{ if(onOk()!==false) $("#modal").classList.remove("on"); };
  $("#modal").classList.add("on");
}
function closeModal(){ $("#modal").classList.remove("on"); if(mCancel) mCancel(); }
function askReset(i){
  showModal("기록을 지울까요?", `${i+1}번 체험자의 심박수 기록을 모두 지워요. 지운 기록은 되돌릴 수 없어요.`,
    ()=>{ lanes[i]=blank(); goHome(); });
}
function askResetAll(){
  showModal("모두 지울까요?", "5명 모두의 기록을 지워요. 지운 기록은 되돌릴 수 없어요.",
    ()=>{ lanes=Array.from({length:LANES}, blank); renderHome(); });
}
window.addEventListener("beforeunload", e=>{ if(lanes.some(l=>l.step>=4 && l.step<5)){ e.preventDefault(); e.returnValue=""; } });


/* ===== 5명 동시 진행 화면 ===== */
let gSig = "";
const ready = L => L.rest && L.peak && L.method;
const used  = L => L.rest || L.peak || L.method || L.step>=4;
function laneSig(){ return lanes.map(L=>[L.step,L.method,!!L.end,L.step===5?L.after:""].join(".")).join("|"); }
function renderHome(force){
  const sig = laneSig();
  if(force || sig!==gSig || !$("#lanes").children.length){ gSig=sig; buildGroup(); }
  lanes.forEach((L,i)=>{ const t=$("#gt"+i); if(t && L.step===4 && !L.end){ const e=elapsed(L); t.textContent=fmt(e); t.classList.toggle("over", e>RECOVER_SEC-30); } });
}
function buildGroup(){
  const anyRunning = lanes.some(L=>L.step===4 || L.step===5);
  const nReady = lanes.filter(L=>L.step<4 && ready(L)).length;
  $("#lanes").innerHTML = lanes.map((L,i)=>{
    let body;
    if(L.step<4){
      body = `
        <label class="glb">① 안정 시 심박수</label>
        <div class="gin"><input type="number" inputmode="numeric" id="gr${i}" value="${L.rest??''}" placeholder="0" oninput="gSet(${i},'rest',this.value)"><span>bpm</span></div>
        <label class="glb">② 운동 후 최고 심박수</label>
        <div class="gin"><input type="number" inputmode="numeric" id="gp${i}" value="${L.peak??''}" placeholder="0" oninput="gSet(${i},'peak',this.value)"><span>bpm</span></div>
        <div class="gwarn" id="gw${i}"></div>
        <label class="glb">③ 회복법 고르기</label>
        <div class="gm">${Object.entries(METHODS).map(([k,m])=>`<button class="${L.method===k?'on':''}" onclick="gMethod(${i},'${k}')">${m.em}<br>${m.name}</button>`).join("")}</div>
        <div class="gstate">${ready(L)?'✅ 준비 완료':'입력 중…'}</div>`;
    } else if(L.step===4 && !L.end){
      const m=METHODS[L.method];
      body = `<div class="gstate">${m.em} ${m.name} 중 · 목표 ${L.rest-RANGE}~${L.rest+RANGE}</div>
        <div class="gtimer" id="gt${i}">${fmt(elapsed(L))}</div>
        <button class="btn btn-green gbig" onclick="gDone(${i})">✅ 회복 완료</button>`;
    } else if(L.step===4){
      const over = elapsed(L)>=RECOVER_SEC;
      body = `<div class="gstate">${over?'⏰ 5분 종료':'✅ 회복 완료'} · ${fmt(elapsed(L))}</div>
        <label class="glb">④ 지금 심박수</label>
        <div class="gin"><input type="number" inputmode="numeric" id="ga${i}" placeholder="0"><span>bpm</span></div>
        <div class="gwarn" id="gw${i}"></div>
        <div class="grow"><button class="btn btn-ghost" ${over?'style="display:none"':''} onclick="gUndo(${i})">취소</button>
        <button class="btn btn-main" style="flex:1" onclick="gAfter(${i})">확인</button></div>`;
    } else {
      const {score,band}=analyze(L);
      body = `<div class="gscore">${BAND[band].face} ${score}점</div><div class="gstate">${BAND[band].name}</div>
        <button class="btn btn-pink gbig" onclick="openLane(${i})">📋 처방전·QR 보기</button>`;
    }
    return `<div class="lane gl s${L.step}"><div class="no">${i+1}번</div>${body}</div>`;
  }).join("");
  const sb=$("#gstart");
  sb.disabled = nReady===0;
  sb.textContent = nReady ? `▶ ${nReady}명 동시에 회복 시작` : (anyRunning ? "⏱ 회복 진행 중" : "▶ 동시에 회복 시작");
}
function gSet(i,k,v){
  const L=lanes[i]; v=Math.round(+v); L[k]= v>0 ? v : null;
  if(L.step===0 && used(L)) L.step=1;
  const w=$("#gw"+i);
  if(k==='peak' && w){ if(v>=LIMIT){ w.style.display='block'; w.textContent=`⚠️ ${LIMIT}bpm 이상! 운동을 바로 멈춰요.`; } else w.style.display='none'; }
  if(ready(L)) L.step=3; else if(L.step===3) L.step=1;
  refreshStart();
}
function refreshStart(){
  const n=lanes.filter(L=>L.step<4 && ready(L)).length, sb=$("#gstart");
  sb.disabled=n===0; if(n) sb.textContent=`▶ ${n}명 동시에 회복 시작`;
  lanes.forEach((L,i)=>{ const card=$("#lanes").children[i]; const st=card&&L.step<4&&card.querySelector('.gstate'); if(st) st.textContent=ready(L)?'✅ 준비 완료':'입력 중…'; });
}
function gMethod(i,k){ const L=lanes[i]; L.method=k; if(L.step===0) L.step=1; if(ready(L)) L.step=3; renderHome(true); }
function gStart(){
  const list=lanes.map((L,i)=>[L,i]).filter(([L])=>L.step<4 && ready(L));
  const bad=list.filter(([L,i])=>{
    const ok = L.rest>=40 && L.rest<=230 && L.peak>=40 && L.peak<=230 && L.peak>L.rest+RANGE;
    if(!ok){ const w=$("#gw"+i); w.style.display='block'; w.textContent='숫자를 확인해 주세요 (최고 심박수가 안정 시보다 높아야 해요).'; }
    return !ok;
  });
  if(bad.length) return;
  const now=Date.now();
  list.forEach(([L])=>{ L.start=now; L.end=null; L.timedOut=false; L.step=4; });
  renderHome(true);
}
function gDone(i){ const L=lanes[i]; L.end=Date.now(); renderHome(true); setTimeout(()=>$("#ga"+i)&&$("#ga"+i).focus(),50); }
function gUndo(i){ lanes[i].end=null; renderHome(true); }
function gAfter(i){
  const L=lanes[i], v=Math.round(+$("#ga"+i).value), w=$("#gw"+i);
  if(!v||v<40||v>230){ w.style.display='block'; w.textContent='40~230 사이 숫자를 입력해 주세요.'; return; }
  L.after=v; L.timedOut = elapsed(L)>=RECOVER_SEC; if(L.timedOut) L.end=L.start+RECOVER_SEC*1000;
  L.step=5; renderHome(true);
}
function goHome(){ $("#flow").classList.remove("on"); $("#home").classList.add("on"); renderHome(true); }

/* ===== QR코드: 휴대폰으로 결과 받기 ===== */
const RESULT_URL = "https://solovelykwak-art.github.io/heart-result/";   // 휴대폰 결과 페이지 주소
function resultLink(L){
  const t=Math.round(elapsed(L));
  return `${RESULT_URL}?r=${L.rest}&p=${L.peak}&a=${L.after}&t=${t}&o=${L.timedOut?1:0}`;
}
function qrSVG(text){ const q=qrcode(0,'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:4, margin:2, scalable:true}); }
function resultHTML(L){
  return `<div class="res">
    ${picResult(L)}
    <div class="qrbox"><div class="qr">${qrSVG(resultLink(L))}</div>
      <b>📱 휴대폰으로 가져가기</b><span>카메라로 QR코드를 찍으면<br>내 처방전을 휴대폰에서 볼 수 있어요.</span></div>
  </div>
  <p class="note">이 처방전은 오늘 1회 측정한 값으로 만든 생활 습관 조언이에요. 의학적 진단이 아니에요.</p>
  <div class="actions" style="justify-content:center">
    <button class="btn btn-ghost" onclick="goHome()">← 전체 화면</button>
    <button class="btn btn-pink" onclick="askReset(${cur})">🗑 체험 끝! 기록 지우고 다음 친구</button>
  </div>`;
}
/* 주소에 결과 숫자가 붙어 있으면(휴대폰에서 QR로 연 경우) 처방전만 보여 줘요 */
(function phoneView(){
  const q=new URLSearchParams(location.search);
  if(!q.has('r')) return;
  const n=k=>Math.round(+q.get(k)||0);
  const L={rest:n('r'), peak:n('p'), after:n('a'), timedOut:q.get('o')==='1', start:0, end:n('t')*1000};
  clearInterval(tick);
  window.onbeforeunload=null;
  document.body.innerHTML=`<div class="wrap phone">${picResult(L)}
    <p class="note">화면을 캡처하면 내 처방전을 사진으로 간직할 수 있어요 📸<br>이 처방전은 오늘 1회 측정한 값으로 만든 생활 습관 조언이에요. 의학적 진단이 아니에요.<br>2026 AI·SW 체험 한마당 · 장산초등학교</p></div>`;
})();

if(!new URLSearchParams(location.search).has("r")) renderHome();
</script>
</body>
