<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 기록판</title>
<style>
:root{--bg:#0f1530;--card:#1a2350;--line:#2c3770;--txt:#f4f6ff;--sub:#a9b3e0;--hot:#ff5a5f;--hot2:#ffb347;--cool:#2ed3a0;--cool2:#5ad1ff;--gold:#ffd54a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:center;padding:2.4vh 3vw 1vh;text-align:center}
h1{margin:0;font-size:clamp(28px,4.4vw,58px);letter-spacing:-.02em}
h1 small{display:block;font-size:.36em;color:var(--sub);font-weight:500;letter-spacing:0;margin-top:.5vh}
main{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:2.4vw;padding:1.5vh 3vw 2vh}
.rec{background:var(--card);border-radius:26px;padding:3vh 2.4vw 64px;display:flex;flex-direction:column;align-items:center;text-align:center;border:3px solid var(--line);position:relative}
.rec h2{margin:0;font-size:clamp(22px,2.7vw,38px);white-space:nowrap}
.rec p.d{margin:.8vh 0 0;color:var(--sub);font-size:clamp(14px,1.5vw,20px)}
.hot h2{color:var(--hot2)} .cool h2{color:var(--cool)} .score h2{color:var(--gold)} .score .big{color:var(--gold)}
.crown{font-size:clamp(34px,4.5vw,64px);margin-top:1.5vh;line-height:1}
.big{font-weight:900;font-variant-numeric:tabular-nums;line-height:1;margin:1vh 0 0;font-size:clamp(80px,11vw,180px);letter-spacing:-.03em}
.hot .big{color:var(--hot)} .cool .big{color:var(--cool2)}
.unit{font-size:clamp(20px,2.6vw,36px);color:var(--sub);font-weight:700;margin-top:.5vh}
.detail{margin-top:1.4vh;font-size:clamp(15px,1.7vw,22px);color:var(--txt);min-height:1.4em}
.prev{margin-top:.6vh;font-size:clamp(13px,1.4vw,18px);color:var(--sub);min-height:1.3em}
.empty{margin:auto;color:var(--sub);font-size:clamp(20px,2.4vw,32px);line-height:1.5}
.rec.new{animation:pop 2.2s ease}
@keyframes pop{0%{transform:scale(1.04);box-shadow:0 0 0 10px rgba(255,213,74,.55);border-color:var(--gold)}100%{transform:none;box-shadow:none}}
.edit{position:absolute;right:14px;bottom:14px;border:0;border-radius:40px;padding:10px 16px;background:#3b4bb0;color:#fff;font-size:15px;font-weight:700;opacity:.55;cursor:pointer;font-family:inherit}
.edit:hover,.edit:focus{opacity:1}
.ticker{margin:0 3vw 2vh;padding:1.4vh 2vw;border-radius:14px;background:rgba(255,255,255,.06);font-size:clamp(16px,1.9vw,26px);text-align:center;min-height:1.6em}
#panel{position:fixed;inset:0;background:rgba(5,8,20,.72);display:none;align-items:center;justify-content:center;padding:16px}
#panel.on{display:flex}
.sheet{background:#fff;color:#1b2140;border-radius:20px;padding:22px;width:min(520px,100%);max-height:94vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:22px}
.sheet .hint{margin:0 0 14px;color:#5a6390;font-size:14px}
.row{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.row label{font-weight:700;font-size:15px}
.row input{font-size:24px;padding:10px 12px;border:2px solid #cdd3ee;border-radius:12px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btns button{flex:1;min-width:120px;font-size:17px;font-weight:700;padding:12px;border-radius:12px;border:0;cursor:pointer;font-family:inherit}
.primary{background:#3b4bb0;color:#fff} .ghost{background:#eef0fa;color:#1b2140} .warn{background:#ffe9e9;color:#b3261e}
#msg{min-height:1.3em;color:#b3261e;font-size:14px;margin:4px 0 0}
@media (max-width:900px){main{grid-template-columns:1fr}}
</style></head>
<body>
<header><h1>🏆 오늘의 최고 기록<small>두근두근 심박수를 낮춰라 · 장산초 E-11 · 이 기록을 깨 보세요!</small></h1></header>
<main>
  <section class="rec hot" id="hotCard"></section>
  <section class="rec cool" id="coolCard"></section>
  <section class="rec score" id="scoreCard"></section>
</main>
<div class="ticker" id="ticker"></div>

<div id="panel" onclick="if(event.target===this)closePanel()">
  <div class="sheet">
    <h3 id="pTitle"></h3>
    <p class="hint" id="pHint"></p>
    <div id="pFields"></div>
    <p id="msg"></p>
    <div class="btns">
      <button class="primary" onclick="saveRec()">새 기록으로 바꾸기</button>
      <button class="ghost" onclick="closePanel()">닫기</button>
    </div>
    <div class="btns" style="margin-top:14px">
      <button class="ghost" id="undoBtn" onclick="undo(this)">↩ 바로 전 기록으로 되돌리기</button>
      <button class="warn" onclick="resetAll(this)">오늘 기록 모두 지우기</button>
    </div>
  </div>
</div>

<script>
const KEY="heartBest";
/* 저장 모양: {hot:{now:{peak},hist:[...]}, cool:{now:{peak,hr2,drop},hist:[...]}} */
let data;try{data=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){data=null}
if(!data||!data.hot||!data.cool)data={hot:{now:null,hist:[]},cool:{now:null,hist:[]}};
if(!data.score)data.score={now:null,hist:[]};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const $=id=>document.getElementById(id);
let mode=null;

function card(kind){
  const d=data[kind], n=d.now, hot=kind==="hot";
  if(kind==="score") return scoreCard(d);
  const head=hot?`<h2>🔥 최고 심박수</h2><p class="d">운동 직후 가장 높이 올린 기록</p>`
               :`<h2>💚 회복왕</h2><p class="d">운동 뒤 가장 많이 낮춘 기록</p>`;
  let body;
  if(!n) body=`<div class="empty">아직 기록이 없어요<br>첫 번째 주인공이 되어 보세요!</div>`;
  else{
    const prev=d.hist.length?d.hist[d.hist.length-1]:null;
    body=`<div class="crown">👑</div>
      <div class="big">${hot?n.peak:"−"+n.drop}</div><div class="unit">bpm</div>
      <div class="detail">${hot?"":`${n.peak} → ${n.hr2}bpm`}</div>
      <div class="prev">${prev?`이전 기록 ${hot?prev.peak:"−"+prev.drop}bpm · 오늘 ${d.hist.length}번 깨졌어요`:"오늘의 첫 기록"}</div>`;
  }
  return head+body+`<button class="edit" onclick="openPanel('${kind}')">✏️ 기록 바꾸기</button>`;
}
function scoreCard(d){
  const n=d.now, prev=d.hist.length?d.hist[d.hist.length-1]:null;
  const body=!n?`<div class="empty">아직 기록이 없어요<br>첫 번째 주인공이 되어 보세요!</div>`
    :`<div class="crown">👑</div><div class="big">${n.score}</div><div class="unit">점</div><div class="detail">&nbsp;</div>
      <div class="prev">${prev?`이전 기록 ${prev.score}점 · 오늘 ${d.hist.length}번 깨졌어요`:"오늘의 첫 기록"}</div>`;
  return `<h2>🏅 최고 점수</h2><p class="d">처방전에 나온 가장 높은 점수</p>`+body+`<button class="edit" onclick="openPanel('score')">✏️ 기록 바꾸기</button>`;
}
function render(flash){
  $("hotCard").innerHTML=card("hot");$("coolCard").innerHTML=card("cool");$("scoreCard").innerHTML=card("score");
  if(flash){const c=$(flash+"Card");c.classList.remove("new");void c.offsetWidth;c.classList.add("new");}
}
function openPanel(kind){
  mode=kind;const n=data[kind].now;
  $("pTitle").textContent={hot:"🔥 최고 심박수 기록 바꾸기",cool:"💚 회복왕 기록 바꾸기",score:"🏅 최고 점수 기록 바꾸기"}[kind];
  $("pHint").textContent=n?`지금 기록: ${kind==="hot"?n.peak+"bpm":kind==="cool"?"−"+n.drop+"bpm":n.score+"점"}. 이보다 좋은 기록이 나왔을 때 적어 주세요.`:"첫 기록을 적어 주세요.";
  $("pFields").innerHTML=kind==="score"
    ?`<div class="row"><label for="f1">처방전 점수</label><input id="f1" type="number" inputmode="numeric" placeholder="예: 92"></div>`
    :kind==="hot"
    ?`<div class="row"><label for="f1">운동 직후 심박수</label><input id="f1" type="number" inputmode="numeric" placeholder="예: 172"></div>`
    :`<div class="two"><div class="row"><label for="f1">운동 직후 심박수</label><input id="f1" type="number" inputmode="numeric" placeholder="예: 160"></div>
       <div class="row"><label for="f2">심호흡 1분 뒤 심박수</label><input id="f2" type="number" inputmode="numeric" placeholder="예: 112"></div></div>`;
  $("msg").textContent="";$("undoBtn").disabled=!data[kind].hist.length;$("undoBtn").style.opacity=data[kind].hist.length?1:.4;
  $("panel").classList.add("on");setTimeout(()=>$("f1").focus(),50);
}
function closePanel(){$("panel").classList.remove("on");disarm()}
function saveRec(){
  const m=$("msg"),d=data[mode],n=d.now,a=+$("f1").value;
  if(mode==="score"){
    if(!(a>=70&&a<=100)){m.textContent="점수를 확인해 주세요 (70~100).";return}
    if(n&&a<=n.score){m.textContent=`지금 기록(${n.score}점)보다 높아야 바꿀 수 있어요.`;return}
    if(n)d.hist.push(n);d.now={score:a};save();closePanel();render("score");say(`🎉 새로운 최고 점수 ${a}점! 축하해요!`);return;
  }
  if(!(a>=60&&a<=230)){m.textContent="운동 직후 심박수를 확인해 주세요 (60~230).";return}
  let rec;
  if(mode==="hot"){
    if(n&&a<=n.peak){m.textContent=`지금 기록(${n.peak}bpm)보다 높아야 바꿀 수 있어요.`;return}
    rec={peak:a};
  }else{
    const b=+$("f2").value;
    if(!(b>=40&&b<=230)){m.textContent="심호흡 1분 뒤 심박수를 확인해 주세요 (40~230).";return}
    if(b>=a){m.textContent="심호흡 1분 뒤 심박수는 운동 직후보다 낮아야 해요.";return}
    if(n&&a-b<=n.drop){m.textContent=`${a-b}만큼 내려왔어요. 지금 기록(−${n.drop})보다 많이 내려와야 바꿀 수 있어요.`;return}
    rec={peak:a,hr2:b,drop:a-b};
  }
  if(n)d.hist.push(n);d.now=rec;save();closePanel();render(mode);
  say(mode==="hot"?`🎉 새로운 최고 심박수 ${rec.peak}bpm! 대단해요!`:`🎉 새로운 회복왕! 운동 뒤 ${rec.drop}bpm을 낮췄어요!`);
}
/* 되돌리기·지우기는 두 번 눌러야 돼요 (실수 방지) */
let armed=null,armT=null,armBtn=null,armOld="";
function disarm(){if(armBtn)armBtn.textContent=armOld;armed=null;armBtn=null;clearTimeout(armT)}
function twice(key,btn,label){if(armed===key){disarm();return true}disarm();armed=key;armBtn=btn;armOld=btn.textContent;btn.textContent=label;armT=setTimeout(disarm,3000);return false}
function undo(btn){const d=data[mode];if(!d.hist.length)return;if(twice("u",btn,"한 번 더 누르면 되돌려요")){d.now=d.hist.pop();save();render();openPanel(mode)}}
function resetAll(btn){if(twice("r",btn,"정말 지울까요? 한 번 더 누르세요")){data={hot:{now:null,hist:[]},cool:{now:null,hist:[]},score:{now:null,hist:[]}};save();render();closePanel()}}

const tips=["🔥 2분 동안 쉬지 않고 버피! 150을 넘겨 봐요","💚 운동 뒤 심호흡으로 빨리 회복하는 것이 진짜 실력이에요","🫁 코로 4초 들이마시고, 4초 멈추고, 입으로 6초 내쉬어요","🏃 회복이 빠를수록 몸과 마음의 회복탄력성이 좋아요","👀 다음 기록의 주인공은 바로 여러분!"];
let ti=0,holdUntil=0;
function say(t){$("ticker").textContent=t;holdUntil=Date.now()+15000}
function tick(){if(Date.now()<holdUntil)return;$("ticker").textContent=tips[ti++%tips.length]}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&$("panel").classList.contains("on"))saveRec()});
render();tick();setInterval(tick,6000);
</script>
</body></html>
